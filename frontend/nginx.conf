server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS — re-resolve backend on every request (survives restarts)
    resolver 127.0.0.11 valid=5s;
    set $backend_upstream http://backend:8000;

    # Proxy API requests to backend
    # SSE chat streams need buffering disabled
    location ~ ^/api/v1/sessions/.+/chat$ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # All other API requests
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy uploaded files
    location /uploads/ {
        proxy_pass $backend_upstream;
    }

    # Proxy generated files
    location /generated/ {
        proxy_pass $backend_upstream;
    }

    # SPA: serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
